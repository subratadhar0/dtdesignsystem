// ---------- Alert onMount: wire up interactivity ----------
function mountAlertPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  // Tab switching
  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (alertState.tab === tab) return;
      alertState.tab = tab;
      // Re-render alert page within section-content
      root.innerHTML = renderAlertPage();
      mountAlertPage();
      mountAlertCodeCopy();
    });
  });

  if (alertState.tab !== 'playground') return;

  // ---- Playground interactivity ----
  const updatePreview = () => {
    const target = document.getElementById('alert-preview');
    if (target) target.innerHTML = renderAlertComponent(alertState);
  };

  const updateRowVisibility = () => {
    const s = alertState;
    const set = (key, visible) => {
      const r = root.querySelector(`[data-row="${key}"]`);
      if (r) r.dataset.hidden = String(!visible);
    };
    set('leadingIconType', s.leadingIcon);
    set('showAction1',     s.showAction);
    set('action1Label',    s.showAction && s.showAction1);
    set('action1ShowIcon', s.showAction && s.showAction1);
    set('showAction2',     s.showAction);
    set('action2Label',    s.showAction && s.showAction2);
    set('action2ShowIcon', s.showAction && s.showAction2);
  };

  // Chip groups
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        alertState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === alertState[key]));
        });
        updatePreview();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      alertState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      alertState[key] = !alertState[key];
      btn.setAttribute('aria-checked', String(alertState[key]));
      updateRowVisibility();
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(alertState, ALERT_DEFAULTS);
      const body = document.getElementById('alert-tab-body');
      if (body) {
        body.innerHTML = renderAlertPlayground();
        mountAlertPage();
      }
    });
  }
}

// ---------- Code-tab copy & wire ----------
function mountAlertCodeCopy() {
  document.querySelectorAll('[data-copy]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copy;
      const text = which === 'jsx'
        ? renderAlertJSXPlain(alertState)
        : `import { Alert } from '@devicethread/ui';`;
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        // best-effort fallback
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

// ---------- Render: Avatar anatomy ----------
function renderAvatarComponent(s) {
  const dims = AVATAR_SIZES[s.size] || AVATAR_SIZES.l;
  const dotSize = Math.max(6, Math.round(dims.px * 0.28));
  const initialsText = String(s.initials || '').slice(0, 2);
  const showDot = s.status && s.status !== 'offline';

  let inner = '';
  if (s.type === 'image') {
    const safeSrc = escapeHTML(s.src);
    const safeAlt = escapeHTML(s.alt || 'Avatar');
    inner = `
      <img class="avatar__img" src="${safeSrc}" alt="${safeAlt}"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
      <div class="avatar__fallback" style="display:none"><i class="ti ti-user"></i></div>
    `;
  } else if (s.type === 'icon') {
    inner = `<span class="avatar__icon" style="font-size:${Math.round(dims.px * 0.5)}px"><i class="ti ti-user"></i></span>`;
  } else {
    inner = `<span class="avatar__initials" style="font-size:${dims.font}px">${escapeHTML(initialsText)}</span>`;
  }

  return `
    <span class="avatar" style="width:${dims.px}px; height:${dims.px}px; font-size:${dims.font}px;">
      ${inner}
      ${showDot ? `<span class="avatar__dot avatar__dot--${s.status}" style="width:${dotSize}px; height:${dotSize}px;"></span>` : ''}
    </span>
  `;
}

  else if (avatarState.tab === 'code')       body = renderAvatarCode();

  return `

// ---------- Mount ----------
function mountAvatarPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  // Tab switching
  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (avatarState.tab === tab) return;
      avatarState.tab = tab;
      root.innerHTML = renderAvatarPage();
      mountAvatarPage();
      mountAvatarCodeCopy();
    });
  });

  if (avatarState.tab !== 'playground') return;

  const updatePreview = () => {
    const target = document.getElementById('avatar-preview');
    if (target) target.innerHTML = renderAvatarComponent(avatarState);
  };
  const updateRowVisibility = () => {
    const s = avatarState;
    const set = (key, visible) => {
      const r = root.querySelector(`[data-row="${key}"]`);
      if (r) r.dataset.hidden = String(!visible);
    };
    set('src',      s.type === 'image');
    set('initials', s.type === 'initials');
    set('alt',      s.type === 'image');
  };

  // Chips
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        avatarState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === avatarState[key]));
        });
        if (key === 'type') updateRowVisibility();
        updatePreview();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      avatarState[key] = input.value;
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(avatarState, AVATAR_DEFAULTS);
      const body = document.getElementById('avatar-tab-body');
      if (body) {
        body.innerHTML = renderAvatarPlayground();
        mountAvatarPage();
      }
    });
  }
}

function mountAvatarCodeCopy() {
  document.querySelectorAll('[data-copy-avatar]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copyAvatar;
      const text = which === 'jsx'
        ? renderAvatarJSXPlain(avatarState)
        : `import { Avatar } from '@devicethread/ui';`;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

};

// ---------- Render: Badge anatomy ----------
function renderBadgeComponent(s) {
  const t = BADGE_TONES[s.tone] && BADGE_TONES[s.tone][s.style];
  if (!t) return '';
  const style = `background:${t.bg};border-color:${t.border};color:${t.text}`;

  let leading = '';
  if (s.leadingIcon) {
    if (s.leadingIconType === 'dot') {
      leading = `<span class="badge__leading"><span class="badge__dot" style="background:${t.icon}"></span></span>`;
    } else {
      const icon = BADGE_LEADING_ICONS[s.leadingIconType] || 'ti-alert-circle';
      leading = `<span class="badge__leading" style="color:${t.icon}"><i class="ti ${icon}"></i></span>`;
    }
  }

  let trailing = '';
  if (s.trailingIcon) {
    const icon = BADGE_TRAILING_ICONS[s.trailingIconType] || 'ti-x';
    // Use icon colour from tone for heavy style (white) for legibility;
    // light style keeps a neutral grey trailing per spec.
    const trailingColor = s.style === 'heavy' ? t.icon : '#757575';
    trailing = `<span class="badge__trailing" style="color:${trailingColor}"><i class="ti ${icon}"></i></span>`;
  }

  const numberShown = s.enableNumberBadge ? Math.max(0, Math.min(99, Number(s.numberBadge) || 0)) : null;

  return `
    <span class="badge-wrap">
      <span class="badge" style="${style}">
        ${leading}
        <span class="badge__text">${escapeHTML(s.children)}</span>
        ${trailing}
      </span>
      ${numberShown !== null ? `<span class="badge__number">${numberShown}</span>` : ''}
    </span>
  `;
}

// ---------- Code tab ----------
function renderBadgeJSX(s) {
  const str = (k) => `  <span class="tok-prop">${k}</span><span class="tok-punct">=</span><span class="tok-string">"${escapeHTML(s[k])}"</span>`;
  const bool = (k) => s[k]
    ? `  <span class="tok-prop">${k}</span>`
    : `  <span class="tok-prop">${k}</span><span class="tok-punct">={</span><span class="tok-bool">false</span><span class="tok-punct">}</span>`;
  const num = (k) => `  <span class="tok-prop">${k}</span><span class="tok-punct">={</span><span class="tok-bool">${s[k]}</span><span class="tok-punct">}</span>`;
  return [
    `<span class="tok-punct">&lt;</span><span class="tok-comp">Badge</span>`,
    str('tone'),
    str('style'),
    bool('leadingIcon'),
    str('leadingIconType'),
    bool('enableNumberBadge'),
    num('numberBadge'),
    bool('trailingIcon'),
    str('trailingIconType'),
    `<span class="tok-punct">&gt;</span>`,
    `  ${escapeHTML(s.children)}`,
    `<span class="tok-punct">&lt;/</span><span class="tok-comp">Badge</span><span class="tok-punct">&gt;</span>`,
  ].join('\n');
}
function renderBadgeJSXPlain(s) {
  const bool = (k) => s[k] ? `  ${k}` : `  ${k}={false}`;
  const str = (k) => `  ${k}="${s[k]}"`;
  const num = (k) => `  ${k}={${s[k]}}`;
  return [
    `<Badge`,
    str('tone'), str('style'),
    bool('leadingIcon'), str('leadingIconType'),
    bool('enableNumberBadge'), num('numberBadge'),
    bool('trailingIcon'), str('trailingIconType'),
    `>`,
    `  ${s.children}`,
    `</Badge>`,
  ].join('\n');
}
function renderBadgeCode() {
  const importLine = `<span class="tok-tag">import</span> <span class="tok-punct">{</span> <span class="tok-comp">Badge</span> <span class="tok-punct">}</span> <span class="tok-tag">from</span> <span class="tok-string">'@devicethread/ui'</span><span class="tok-punct">;</span>`;
  return `

}

// ---------- Mount ----------
function mountBadgePage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (badgeState.tab === tab) return;
      badgeState.tab = tab;
      root.innerHTML = renderBadgePage();
      mountBadgePage();
      mountBadgeCodeCopy();
    });
  });

  if (badgeState.tab !== 'playground') return;

  const updatePreview = () => {
    const target = document.getElementById('badge-preview');
    if (target) target.innerHTML = renderBadgeComponent(badgeState);
  };
  const updateRowVisibility = () => {
    const s = badgeState;
    const set = (key, visible) => {
      const r = root.querySelector(`[data-row="${key}"]`);
      if (r) r.dataset.hidden = String(!visible);
    };
    set('leadingIconType',  s.leadingIcon);
    set('numberBadge',      s.enableNumberBadge);
    set('trailingIconType', s.trailingIcon);
    // Also reflect disabled state on range when number badge is off
    const rc = root.querySelector('.range-control');
    if (rc) rc.dataset.disabled = String(!s.enableNumberBadge);
  };

  // Chips
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        badgeState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === badgeState[key]));
        });
        updatePreview();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      badgeState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      badgeState[key] = !badgeState[key];
      btn.setAttribute('aria-checked', String(badgeState[key]));
      updateRowVisibility();
      updatePreview();
    });
  });

  // Range slider
  root.querySelectorAll('[data-range]').forEach(input => {
    const key = input.dataset.range;
    input.addEventListener('input', () => {
      const val = Number(input.value);
      badgeState[key] = val;
      const pct = ((val - input.min) / (input.max - input.min)) * 100;
      input.style.background = `linear-gradient(to right, #1565C0 0%, #1565C0 ${pct}%, #E0E0E0 ${pct}%, #E0E0E0 100%)`;
      const valEl = root.querySelector(`[data-range-value="${key}"]`);
      if (valEl) valEl.textContent = val;
      updatePreview();
    });
  });

  // Reset

// ---------- Mount ----------
function mountButtonPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (buttonState.tab === tab) return;
      buttonState.tab = tab;
      root.innerHTML = renderButtonPage();
      mountButtonPage();
      mountButtonCodeCopy();
    });
  });

  if (buttonState.tab !== 'playground') return;

  const updatePreview = () => {
    const target = document.getElementById('button-preview');
    if (target) target.innerHTML = renderButtonComponent(buttonState);
  };

  // Chips
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        buttonState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === buttonState[key]));
        });
        updatePreview();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      buttonState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles (no cascading visibility)
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      buttonState[key] = !buttonState[key];
      btn.setAttribute('aria-checked', String(buttonState[key]));
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(buttonState, BUTTON_DEFAULTS);
      const body = document.getElementById('button-tab-body');
      if (body) {
        body.innerHTML = renderButtonPlayground();
        mountButtonPage();
      }
    });
  }
}

    <div class="comp-page">
      ${renderCompTabs(checkboxState.tab, TABS)}
      <div id="checkbox-tab-body">${body}</div>
    </div>
  `;
}

// ---------- Mount ----------
function mountCheckboxPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (checkboxState.tab === tab) return;
      checkboxState.tab = tab;
      root.innerHTML = renderCheckboxPage();
      mountCheckboxPage();
      mountCheckboxCodeCopy();
    });
  });

  if (checkboxState.tab !== 'playground') return;

  const updatePreview = () => {
    const target = document.getElementById('checkbox-preview');
    if (target) target.innerHTML = renderCheckboxComponent(checkboxState);
  };

  // Chips
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        checkboxState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === checkboxState[key]));
        });
        updatePreview();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      checkboxState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      checkboxState[key] = !checkboxState[key];
      btn.setAttribute('aria-checked', String(checkboxState[key]));
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(checkboxState, CHECKBOX_DEFAULTS);
      const body = document.getElementById('checkbox-tab-body');
      if (body) {
        body.innerHTML = renderCheckboxPlayground();
        mountCheckboxPage();
      }
    });
  }
}

function mountCheckboxCodeCopy() {
  document.querySelectorAll('[data-copy-checkbox]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copyCheckbox;
      const text = which === 'jsx'
        ? renderCheckboxJSXPlain(checkboxState)
        : `import { Checkbox } from '@devicethread/ui';`;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

const INPUT_DEFAULTS = {
  type: 'text',
  label: 'Set Password',
  placeholder: 'Write here',

  disabled: false,
  leadingIcon: true,

  countryCode: '+91',
  otpLength: 6,
  infoText: 'Use 8+ characters including a number',
};

const INPUT_LEADING_ICONS  = { password: 'ti-key',  email: 'ti-mail' };
const INPUT_TRAILING_ICONS = { show: 'ti-eye', hide: 'ti-eye-off', info: 'ti-info-circle' };
const INPUT_ERROR_TEXT     = 'Password must be at least 8 characters';

const inputState = {
  tab: 'playground',
  ...INPUT_DEFAULTS,
};

// ---------- Render: Input component ----------
function renderInputComponent(s) {
  // OTP — N boxes, no label / no icons / no helper
  if (s.type === 'otp') {
    const n = Math.max(4, Math.min(12, Number(s.otpLength) || 6));
    const boxes = Array.from({ length: n }, (_, i) => `
      <input class="input-comp__otp-box ${i === 0 && !s.disabled ? 'input-comp__otp-box--active' : ''}"
             type="text" maxlength="1" inputmode="numeric"
             ${s.disabled ? 'disabled style="background:#FAFAFA;border-color:#E0E0E0;color:#B0BEC5;"' : ''}>
    `).join('');
    return `<div class="input-comp input-comp--otp"><div class="input-comp__otp">${boxes}</div></div>`;
  }

  // Textbox — multiline
  if (s.type === 'textbox') {
    const taCls = ['input-comp__textarea',
      s.error    ? 'input-comp__textarea--error'    : '',
      s.disabled ? 'input-comp__textarea--disabled' : '',
    ].filter(Boolean).join(' ');
    const helperCls = `input-comp__helper${s.error ? ' input-comp__helper--error' : ''}`;
    const helperContent = s.error ? INPUT_ERROR_TEXT : s.helperText;
    return `
      <div class="input-comp">
        ${s.label ? `<label class="input-comp__label">${escapeHTML(s.label)}</label>` : ''}
        <textarea class="${taCls}" placeholder="${escapeHTML(s.placeholder)}" ${s.disabled ? 'disabled' : ''}></textarea>
        ${helperContent ? `<span class="${helperCls}">${s.error ? '<i class="ti ti-alert-circle"></i>' : ''}${escapeHTML(helperContent)}</span>` : ''}
      </div>
    `;
  }

  // text / number
  const fieldCls = ['input-comp__field',
    s.error    ? 'input-comp__field--error'    : '',
    s.disabled ? 'input-comp__field--disabled' : '',
  ].filter(Boolean).join(' ');

  const helperCls = `input-comp__helper${s.error ? ' input-comp__helper--error' : ''}`;
  const helperContent = s.error ? INPUT_ERROR_TEXT : s.helperText;

  const country = s.type === 'number'
    ? `<span class="input-comp__country">${escapeHTML(s.countryCode)}</span>`
    : '';

  const leading = s.leadingIcon
    ? `<span class="input-comp__icon"><i class="ti ${INPUT_LEADING_ICONS[s.leadingIconType] || 'ti-key'}"></i></span>`
    : '';

  let trailing = '';
  if (s.trailingIcon) {
    if (s.trailingIconType === 'show' || s.trailingIconType === 'hide') {
      const icon = INPUT_TRAILING_ICONS[s.trailingIconType];
      const label = s.trailingIconType === 'show' ? 'Hide password' : 'Show password';
      trailing = `
        <button type="button"
                class="input-comp__icon"
                data-toggle-password
                aria-label="${label}"
                ${s.disabled ? 'disabled' : ''}>
          <i class="ti ${icon}"></i>
        </button>
      `;
    } else if (s.trailingIconType === 'info') {
      const tip = (s.infoText || '').trim();
      trailing = `
        <span class="input-comp__icon-wrap">
          <button type="button"
                  class="input-comp__icon"
                  aria-label="More information"
                  ${s.disabled ? 'disabled' : ''}>
            <i class="ti ti-info-circle"></i>
          </button>
          ${tip ? `<span class="input-comp__tooltip" role="tooltip">${escapeHTML(tip)}</span>` : ''}
        </span>
      `;
    } else {
      trailing = `<span class="input-comp__icon"><i class="ti ${INPUT_TRAILING_ICONS[s.trailingIconType] || 'ti-eye-off'}"></i></span>`;
    }
  }

  let inputType;
  if (s.type === 'number') {
    inputType = 'tel';
  } else if (s.trailingIcon && (s.trailingIconType === 'show' || s.trailingIconType === 'hide')) {
    inputType = s.trailingIconType === 'show' ? 'text' : 'password';

  }

  return `

        <input class="input-comp__input" type="${inputType}"
               placeholder="${escapeHTML(s.placeholder)}"
               ${s.disabled ? 'disabled' : ''}>
        ${trailing}
      </div>
      ${helperContent ? `<span class="${helperCls}">${s.error ? '<i class="ti ti-alert-circle"></i>' : ''}${escapeHTML(helperContent)}</span>` : ''}

  `;

function renderInputJSX(s) {

  const bool = (k) => s[k]
    ? `  <span class="tok-prop">${k}</span>`
    : `  <span class="tok-prop">${k}</span><span class="tok-punct">={</span><span class="tok-bool">false</span><span class="tok-punct">}</span>`;
  const num  = (k) => `  <span class="tok-prop">${k}</span><span class="tok-punct">={</span><span class="tok-bool">${s[k]}</span><span class="tok-punct">}</span>`;

  const lines = [`<span class="tok-punct">&lt;</span><span class="tok-comp">Input</span>`];
  lines.push(str('type'));
  if (s.type !== 'otp') {
    lines.push(str('label'));
    lines.push(str('placeholder'));
    lines.push(str('helperText'));
    lines.push(bool('error'));
  }
  lines.push(bool('disabled'));
  if (s.type === 'text' || s.type === 'number') {
    lines.push(bool('leadingIcon'));
    if (s.leadingIcon) lines.push(str('leadingIconType'));
    lines.push(bool('trailingIcon'));

    if (s.trailingIcon && s.trailingIconType === 'info') lines.push(str('infoText'));
  }
  if (s.type === 'number') lines.push(str('countryCode'));
  if (s.type === 'otp')    lines.push(num('otpLength'));
  lines.push(`<span class="tok-punct">/&gt;</span>`);
  return lines.join('\n');
}
function renderInputJSXPlain(s) {
  const str  = (k) => `  ${k}="${s[k]}"`;

  const lines = [`<Input`];
  lines.push(str('type'));
  if (s.type !== 'otp') {
    lines.push(str('label'));

    lines.push(str('helperText'));

  lines.push(bool('disabled'));

// ---------- Mount ----------
function mountInputPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (inputState.tab === tab) return;
      inputState.tab = tab;
      root.innerHTML = renderInputPage();
      mountInputPage();
      mountInputCodeCopy();
    });
  });

  if (inputState.tab !== 'playground') return;

  const rerenderControls = () => {
    const body = document.getElementById('input-tab-body');
    if (body) {
      body.innerHTML = renderInputPlayground();
      mountInputPage();
    }
  };
  const updatePreview = () => {
    const target = document.getElementById('input-preview');
    if (target) {
      target.innerHTML = renderInputComponent(inputState);
      wirePreviewInteractions();
    }
  };

  function wirePreviewInteractions() {
    const target = document.getElementById('input-preview');
    if (!target) return;
    target.querySelectorAll('[data-toggle-password]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (inputState.disabled) return;
        inputState.trailingIconType = inputState.trailingIconType === 'hide' ? 'show' : 'hide';
        rerenderControls();
      });
    });
  }

  // Chips
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        inputState[key] = chip.dataset.chipValue;
        // Row visibility depends on multiple state fields — rerender controls panel
        rerenderControls();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      inputState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles — some toggles affect row visibility, so rerender controls panel
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      inputState[key] = !inputState[key];
      if (key === 'leadingIcon' || key === 'trailingIcon') {
        rerenderControls();
      } else {
        btn.setAttribute('aria-checked', String(inputState[key]));
        updatePreview();
      }
    });
  });

  // Range
  root.querySelectorAll('[data-range]').forEach(input => {
    const key = input.dataset.range;
    input.addEventListener('input', () => {
      const val = Number(input.value);
      inputState[key] = val;
      const pct = ((val - input.min) / (input.max - input.min)) * 100;
      input.style.background = `linear-gradient(to right, #1565C0 0%, #1565C0 ${pct}%, #E0E0E0 ${pct}%, #E0E0E0 100%)`;
      const valEl = root.querySelector(`[data-range-value="${key}"]`);
      if (valEl) valEl.textContent = val;
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(inputState, INPUT_DEFAULTS);
      rerenderControls();
    });
  }

  // Wire up interactions inside the initial preview render
  wirePreviewInteractions();
}

function mountInputCodeCopy() {
  document.querySelectorAll('[data-copy-input]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copyInput;
      const text = which === 'jsx'
        ? renderInputJSXPlain(inputState)
        : `import { Input } from '@devicethread/ui';`;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

// ---------- Mount ----------
function mountRadioPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (radioState.tab === tab) return;
      radioState.tab = tab;
      root.innerHTML = renderRadioPage();
      mountRadioPage();
      mountRadioCodeCopy();
    });
  });

  if (radioState.tab !== 'playground') return;

  const updatePreview = () => {
    const target = document.getElementById('radio-preview');
    if (target) target.innerHTML = renderRadioGroup(radioState);
  };

  // Chips
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        radioState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === radioState[key]));
        });
        updatePreview();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      radioState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      radioState[key] = !radioState[key];
      btn.setAttribute('aria-checked', String(radioState[key]));
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(radioState, RADIO_DEFAULTS);
      const body = document.getElementById('radio-tab-body');
      if (body) {
        body.innerHTML = renderRadioPlayground();
        mountRadioPage();
      }
    });
  }
}

function mountRadioCodeCopy() {
  document.querySelectorAll('[data-copy-radio]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copyRadio;
      const text = which === 'jsx'
        ? renderRadioJSXPlain(radioState)
        : `import { Radio } from '@devicethread/ui';`;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

// ---------- Mount ----------
function mountSwitchesPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (switchesState.tab === tab) return;
      switchesState.tab = tab;
      root.innerHTML = renderSwitchesPage();
      mountSwitchesPage();
      mountSwitchesCodeCopy();
    });
  });

  if (switchesState.tab !== 'playground') return;

  const rerenderControls = () => {
    const body = document.getElementById('switches-tab-body');
    if (body) {
      body.innerHTML = renderSwitchesPlayground();
      mountSwitchesPage();
    }
  };

  const updatePreview = () => {
    const target = document.getElementById('switches-preview');
    if (target) {
      target.innerHTML = renderSwitchesComponent(switchesState);
      wirePreviewInteractions();
    }
  };

  function wirePreviewInteractions() {
    const target = document.getElementById('switches-preview');
    if (!target) return;
    target.querySelectorAll('[data-sw-index]').forEach(seg => {
      seg.addEventListener('click', () => {
        if (switchesState.disabled) return;
        const idx = Number(seg.dataset.swIndex);
        if (idx === switchesState.activeIndex) return;
        switchesState.activeIndex = idx;
        // Need to rerender controls because activeIndex slider value/fill must update
        rerenderControls();
      });
    });
  }

  // Checkbox (disabled)
  root.querySelectorAll('[data-checkbox]').forEach(box => {
    const key = box.dataset.checkbox;
    box.addEventListener('click', () => {
      switchesState[key] = !switchesState[key];
      box.setAttribute('aria-checked', String(switchesState[key]));
      updatePreview();
    });
  });

  // Ranges
  root.querySelectorAll('[data-range]').forEach(input => {
    const key = input.dataset.range;
    input.addEventListener('input', () => {
      const val = Number(input.value);
      switchesState[key] = val;
      const pct = ((val - Number(input.min)) / Math.max(1, Number(input.max) - Number(input.min))) * 100;
      input.style.background = `linear-gradient(to right, #1565C0 0%, #1565C0 ${pct}%, #E0E0E0 ${pct}%, #E0E0E0 100%)`;
      const valEl = root.querySelector(`[data-range-value="${key}"]`);
      if (valEl) valEl.textContent = val;

      if (key === 'switchCount') {
        // Clamp activeIndex so it stays in range
        if (switchesState.activeIndex > val - 1) {
          switchesState.activeIndex = val - 1;
        }
        // Rerender controls so the activeIndex slider's max & fill update
        rerenderControls();
      } else {
        updatePreview();
      }
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(switchesState, SWITCHES_DEFAULTS);
      rerenderControls();
    });
  }

  // Initial wiring for the preview segments
  wirePreviewInteractions();
}

  const bool = (k) => s[k]

    : `  <span class="tok-prop">${k}</span><span class="tok-punct">={</span><span class="tok-bool">false</span><span class="tok-punct">}</span>`;
  return [
    `<span class="tok-punct">&lt;</span><span class="tok-comp">Tabs</span>`,
    `  <span class="tok-prop">displayStyle</span><span class="tok-punct">=</span><span class="tok-string">"${escapeHTML(s.displayStyle)}"</span>`,
    `  <span class="tok-prop">tabs</span><span class="tok-punct">={</span><span class="tok-string">${escapeHTML(labelsStr)}</span><span class="tok-punct">}</span>`,
    `  <span class="tok-prop">activeIndex</span><span class="tok-punct">={</span><span class="tok-bool">${s.activeIndex}</span><span class="tok-punct">}</span>`,
    bool('disabled'),
    `  <span class="tok-prop">onChange</span><span class="tok-punct">={(</span><span class="tok-bool">index</span><span class="tok-punct">) =&gt;</span> <span class="tok-tag">console</span><span class="tok-punct">.</span><span class="tok-prop">log</span><span class="tok-punct">(</span><span class="tok-bool">index</span><span class="tok-punct">)}</span>`,
    `<span class="tok-punct">/&gt;</span>`,
  ].join('\n');
}
function renderTabsJSXPlain(s) {
  const labels = TABS_LABELS_BY_COUNT[s.tabCount];

  return [
    `<Tabs`,
    `  displayStyle="${s.displayStyle}"`,
    `  tabs={${labelsStr}}`,
    `  activeIndex={${s.activeIndex}}`,
    s.disabled ? `  disabled` : `  disabled={false}`,
    `  onChange={(index) => console.log(index)}`,
    `/>`,
  ].join('\n');
}
function renderTabsCode() {

// ---------- Mount ----------
function mountTabsPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (tabsState.tab === tab) return;
      tabsState.tab = tab;
      root.innerHTML = renderTabsPage();
      mountTabsPage();
      mountTabsCodeCopy();
    });
  });

  if (tabsState.tab !== 'playground') return;

  const rerenderControls = () => {
    const body = document.getElementById('tabs-tab-body');
    if (body) {
      body.innerHTML = renderTabsPlayground();
      mountTabsPage();
    }
  };

  const updatePreview = () => {
    const target = document.getElementById('tabs-preview');
    if (target) {
      target.innerHTML = renderTabsComponent(tabsState);
      wirePreviewInteractions();
    }
  };

  function wirePreviewInteractions() {
    const target = document.getElementById('tabs-preview');
    if (!target) return;
    target.querySelectorAll('[data-tab-index]').forEach(item => {
      item.addEventListener('click', () => {
        if (tabsState.disabled) return;
        const idx = Number(item.dataset.tabIndex);
        if (idx === tabsState.activeIndex) return;
        tabsState.activeIndex = idx;
        rerenderControls();
      });
    });
  }

  // Chips (Display Style)
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        tabsState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === tabsState[key]));
        });
        updatePreview();
      });
    });
  });

  // Checkbox (disabled)
  root.querySelectorAll('[data-checkbox]').forEach(box => {
    const key = box.dataset.checkbox;
    box.addEventListener('click', () => {
      tabsState[key] = !tabsState[key];
      box.setAttribute('aria-checked', String(tabsState[key]));
      updatePreview();
    });
  });

  // Ranges
  root.querySelectorAll('[data-range]').forEach(input => {
    const key = input.dataset.range;
    input.addEventListener('input', () => {
      const val = Number(input.value);
      tabsState[key] = val;
      const pct = ((val - Number(input.min)) / Math.max(1, Number(input.max) - Number(input.min))) * 100;
      input.style.background = `linear-gradient(to right, #1565C0 0%, #1565C0 ${pct}%, #E0E0E0 ${pct}%, #E0E0E0 100%)`;
      const valEl = root.querySelector(`[data-range-value="${key}"]`);
      if (valEl) valEl.textContent = val;

      if (key === 'tabCount') {
        if (tabsState.activeIndex > val - 1) tabsState.activeIndex = val - 1;
        rerenderControls();
      } else {
        updatePreview();
      }
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(tabsState, TABS_DEFAULTS);
      rerenderControls();
    });
  }

  // Initial wire
  wirePreviewInteractions();
}

function mountTabsCodeCopy() {
  document.querySelectorAll('[data-copy-tabs]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copyTabs;
      const text = which === 'jsx'
        ? renderTabsJSXPlain(tabsState)
        : `import { Tabs } from '@devicethread/ui';`;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

function renderTitleBarJSX(s) {
  const str  = (k, v = s[k]) => `  <span class="tok-prop">${k}</span><span class="tok-punct">=</span><span class="tok-string">"${escapeHTML(String(v))}"</span>`;
  const bool = (k) => s[k]
    ? `  <span class="tok-prop">${k}</span>`
    : `  <span class="tok-prop">${k}</span><span class="tok-punct">={</span><span class="tok-bool">false</span><span class="tok-punct">}</span>`;
  const num  = (k) => `  <span class="tok-prop">${k}</span><span class="tok-punct">={</span><span class="tok-bool">${s[k]}</span><span class="tok-punct">}</span>`;

  const lines = [`<span class="tok-punct">&lt;</span><span class="tok-comp">TitleBar</span>`];
  lines.push(str('surface'));
  lines.push(bool('filled'));
  lines.push(bool('showContent'));
  if (s.showContent) {
    lines.push(str('title'));
    lines.push(bool('showSubtitle'));
    if (s.showSubtitle) lines.push(str('subtitle'));
  }
  lines.push(bool('showLeadingIcon'));
  if (s.showLeadingIcon) lines.push(str('leadingIconType'));
  lines.push(bool('showTrailingIcons'));
  if (s.showTrailingIcons) lines.push(num('trailingIconCount'));
  lines.push(`<span class="tok-punct">/&gt;</span>`);
  return lines.join('\n');
}
function renderTitleBarJSXPlain(s) {
  const str  = (k, v = s[k]) => `  ${k}="${v}"`;
  const bool = (k) => s[k] ? `  ${k}` : `  ${k}={false}`;
  const num  = (k) => `  ${k}={${s[k]}}`;
  const lines = [`<TitleBar`];
  lines.push(str('surface'));
  lines.push(bool('filled'));
  lines.push(bool('showContent'));
  if (s.showContent) {
    lines.push(str('title'));
    lines.push(bool('showSubtitle'));
    if (s.showSubtitle) lines.push(str('subtitle'));

  lines.push(bool('showLeadingIcon'));
  if (s.showLeadingIcon) lines.push(str('leadingIconType'));
  lines.push(bool('showTrailingIcons'));
  if (s.showTrailingIcons) lines.push(num('trailingIconCount'));
  lines.push(`/>`);
  return lines.join('\n');
}

// ---------- Mount ----------
function mountTitleBarPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (titlebarState.tab === tab) return;
      titlebarState.tab = tab;
      root.innerHTML = renderTitleBarPage();
      mountTitleBarPage();
      mountTitleBarCodeCopy();
    });
  });

  if (titlebarState.tab !== 'playground') return;

  const rerenderControls = () => {
    const body = document.getElementById('titlebar-tab-body');
    if (body) {
      body.innerHTML = renderTitleBarPlayground();
      mountTitleBarPage();
    }
  };
  const updatePreview = () => {
    const target = document.getElementById('titlebar-preview');
    if (target) target.innerHTML = renderTitleBarComponent(titlebarState);
  };

  // Chips — surface change requires rerender (preview-card bg changes)
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        titlebarState[key] = chip.dataset.chipValue;
        if (key === 'surface') {
          rerenderControls();
        } else {
          group.querySelectorAll('.chip').forEach(c => {
            c.setAttribute('aria-pressed', String(c.dataset.chipValue === titlebarState[key]));
          });
          updatePreview();
        }
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      titlebarState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles — many cascade visibility, so just rerender for any toggle
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      titlebarState[key] = !titlebarState[key];
      const cascading = ['showContent', 'showSubtitle', 'showLeadingIcon', 'showTrailingIcons'];
      if (cascading.includes(key)) {
        rerenderControls();
      } else {
        btn.setAttribute('aria-checked', String(titlebarState[key]));
        updatePreview();
      }
    });
  });

  // Ranges
  root.querySelectorAll('[data-range]').forEach(input => {
    const key = input.dataset.range;
    input.addEventListener('input', () => {
      const val = Number(input.value);
      titlebarState[key] = val;
      const pct = ((val - Number(input.min)) / Math.max(1, Number(input.max) - Number(input.min))) * 100;
      input.style.background = `linear-gradient(to right, #1565C0 0%, #1565C0 ${pct}%, #E0E0E0 ${pct}%, #E0E0E0 100%)`;
      const valEl = root.querySelector(`[data-range-value="${key}"]`);
      if (valEl) valEl.textContent = val;
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(titlebarState, TITLEBAR_DEFAULTS);
      rerenderControls();
    });
  }
}

function mountTitleBarCodeCopy() {
  document.querySelectorAll('[data-copy-titlebar]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copyTitlebar;
      const text = which === 'jsx'
        ? renderTitleBarJSXPlain(titlebarState)
        : `import { TitleBar } from '@devicethread/ui';`;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

  else if (tooltipState.tab === 'code')       body = renderTooltipCode();

// ---------- Mount ----------
function mountTooltipPage() {
  const root = document.getElementById('section-content');
  if (!root) return;

  root.querySelectorAll('[data-comp-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      const tab = btn.dataset.compTab;
      if (tooltipState.tab === tab) return;
      tooltipState.tab = tab;
      root.innerHTML = renderTooltipPage();
      mountTooltipPage();
      mountTooltipCodeCopy();
    });
  });

  if (tooltipState.tab !== 'playground') return;

  const updatePreview = () => {
    const target = document.getElementById('tooltip-preview');
    if (target) {
      target.innerHTML = renderTooltipStage(tooltipState, { showRestore: !!tooltipState.dismissed });
      wirePreviewInteractions();
    }
  };

  function wirePreviewInteractions() {
    const target = document.getElementById('tooltip-preview');
    if (!target) return;
    const closeBtn = target.querySelector('[data-tt-close]');
    if (closeBtn) {
      closeBtn.addEventListener('click', () => {
        tooltipState.dismissed = true;
        updatePreview();
      });
    }
    const restoreBtn = target.querySelector('[data-tt-restore]');
    if (restoreBtn) {
      restoreBtn.addEventListener('click', () => {
        tooltipState.dismissed = false;
        updatePreview();
      });
    }
  }

  // Chips
  root.querySelectorAll('[data-chip-group]').forEach(group => {
    const key = group.dataset.chipGroup;
    group.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        tooltipState[key] = chip.dataset.chipValue;
        group.querySelectorAll('.chip').forEach(c => {
          c.setAttribute('aria-pressed', String(c.dataset.chipValue === tooltipState[key]));
        });
        // If position changes while dismissed, keep it dismissed but reposition for when it returns
        updatePreview();
      });
    });
  });

  // Text inputs
  root.querySelectorAll('[data-text-input]').forEach(input => {
    const key = input.dataset.textInput;
    input.addEventListener('input', () => {
      tooltipState[key] = input.value;
      updatePreview();
    });
  });

  // Toggles
  root.querySelectorAll('[data-toggle]').forEach(btn => {
    const key = btn.dataset.toggle;
    btn.addEventListener('click', () => {
      tooltipState[key] = !tooltipState[key];
      btn.setAttribute('aria-checked', String(tooltipState[key]));
      updatePreview();
    });
  });

  // Reset
  const resetBtn = root.querySelector('[data-reset]');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      Object.assign(tooltipState, TOOLTIP_DEFAULTS);
      tooltipState.dismissed = false;
      const body = document.getElementById('tooltip-tab-body');
      if (body) {
        body.innerHTML = renderTooltipPlayground();
        mountTooltipPage();
      }
    });
  }

  wirePreviewInteractions();
}

function mountTooltipCodeCopy() {
  document.querySelectorAll('[data-copy-tooltip]').forEach(btn => {
    if (btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', async () => {
      const which = btn.dataset.copyTooltip;
      const text = which === 'jsx'
        ? renderTooltipJSXPlain(tooltipState)
        : `import { Tooltip } from '@devicethread/ui';`;
      try { await navigator.clipboard.writeText(text); }
      catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(_){}
        ta.remove();
      }
      btn.dataset.copied = 'true';
      btn.innerHTML = `<i class="ti ti-check"></i>`;
      setTimeout(() => {
        btn.dataset.copied = 'false';
        btn.innerHTML = `<i class="ti ti-copy"></i>`;
      }, 1400);
    });
  });
}

const state = {
  tab: 'foundations',       // 'foundations' | 'components'
  active: 'colours.base',   // route id
  expanded: { colours: true },
};

function renderSidebar() {
  const items = state.tab === 'foundations' ? FOUNDATIONS_NAV : COMPONENTS_NAV;
  const sidebar = document.getElementById('sidebar');

  sidebar.innerHTML = items.map(item => {
    if (item.children) {
      const isExpanded = !!state.expanded[item.id];
      // Parent is active if any child is active OR it's the parent of the active item
      const childActive = item.children.some(c => c.id === state.active);
      return `
        <div>
          <div class="nav-item" data-group="${item.id}" aria-expanded="${isExpanded}" data-active="${childActive}">
            <span class="nav-item__chevron" aria-hidden="true">
              <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                <path d="M3 1.5L6.5 5L3 8.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="nav-item__label">${item.label}</span>
          </div>
          <div class="nav-subitems" style="max-height:${isExpanded ? '500px' : '0'}">
            ${item.children.map(c => `
              <div class="nav-subitem" data-route="${c.id}" data-active="${state.active === c.id}">
                ${c.label}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    } else {
      return `
        <div class="nav-item" data-route="${item.id}" data-active="${state.active === item.id}">
          <span class="nav-item__label">${item.label}</span>
        </div>
      `;
    }
  }).join('');

  // Wire up click handlers
  sidebar.querySelectorAll('[data-route]').forEach(el => {
    el.addEventListener('click', () => navigate(el.dataset.route));
  });
  sidebar.querySelectorAll('[data-group]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.dataset.group;
      state.expanded[id] = !state.expanded[id];
      renderSidebar();
    });
  });
}

function navigate(routeId) {
  if (!ROUTES[routeId]) return;
  if (state.active === routeId) return;
  state.active = routeId;

  // Fade out -> swap -> fade in
  const stage = document.getElementById('content-stage');
  stage.classList.add('fading');
  setTimeout(() => {
    renderContent();
    renderSidebar();
    requestAnimationFrame(() => stage.classList.remove('fading'));
  }, 150);
}

function renderContent() {
  const route = ROUTES[state.active];
  document.getElementById('breadcrumb').textContent = route.breadcrumb;
  const heading = document.getElementById('heading');
  heading.textContent = route.heading;
  heading.classList.toggle('display-heading--sentence', route.headingCase === 'sentence');
  document.getElementById('description').textContent = route.description;
  document.getElementById('section-content').innerHTML = route.render();
  if (typeof route.onMount === 'function') route.onMount();
}

function switchTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  document.querySelectorAll('.top-tab').forEach(t => {
    t.setAttribute('aria-current', t.dataset.tab === tab ? 'true' : 'false');
  });
  // Default route for each tab
  const defaultRoute = tab === 'foundations' ? 'colours.base' : 'alert';
  if (tab === 'foundations') state.expanded.colours = true;
  state.active = defaultRoute;

  const stage = document.getElementById('content-stage');
  stage.classList.add('fading');
  setTimeout(() => {
    renderSidebar();
    renderContent();
    requestAnimationFrame(() => stage.classList.remove('fading'));
  }, 150);
}

document.querySelectorAll('.top-tab').forEach(t => {
  t.addEventListener('click', () => switchTab(t.dataset.tab));
});

// Wire up accordion toggles (event delegation — re-binds work because the
// listener is on document and matches any current .comp-accordion__head).
document.addEventListener('click', (e) => {
  const head = e.target.closest('.comp-accordion__head');
  if (!head) return;
  const acc = head.closest('.comp-accordion');
  const isOpen = acc.dataset.open === 'true';
  const body = acc.querySelector('.comp-accordion__body');
  if (isOpen) {
    body.style.maxHeight = '0px';
    acc.dataset.open = 'false';
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    acc.dataset.open = 'true';
  }
});

<script>
/* Theme toggle wire-up + OS preference listener */
(function () {
  var root = document.documentElement;
  var btn = document.querySelector('[data-theme-toggle]');

  function currentTheme() {
    return root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  if (btn) {
    btn.addEventListener('click', function () {
      var next = currentTheme() === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('dt-theme', next); } catch (e) {}
    });
  }

  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function (e) {
      var hasOverride;
      try { hasOverride = localStorage.getItem('dt-theme'); } catch (err) { hasOverride = null; }
      if (hasOverride === 'light' || hasOverride === 'dark') return;
      root.setAttribute('data-theme', e.matches ? 'dark' : 'light');
    };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
})();
</script>
